<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="325.57526" height="192.746" viewBox="0,0,325.57526,192.746"><g transform="translate(-87.32076,-96.07255)"><g fill="#1bff00" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-size="40"><text transform="translate(87.55043,116.05341) scale(0.45933,0.45933)" font-size="40" xml:space="preserve" fill="#1bff00" font-weight="400"><tspan x="0" dy="0">Well done, now moving on to bosses.</tspan><tspan x="0" dy="46.150000000000006px">You will be able to fight a boss</tspan><tspan x="0" dy="46.150000000000006px">every 5 waves. When fighting</tspan><tspan x="0" dy="46.150000000000006px">a boss, attacking it is not necessary.</tspan><tspan x="0" dy="46.150000000000006px">however, attacking it enough will</tspan><tspan x="0" dy="46.150000000000006px">weaken it, causing its attacks to be</tspan><tspan x="0" dy="46.150000000000006px">much easier.</tspan></text><text transform="translate(146.15617,283.70775) scale(0.4259,0.4259)" font-size="40" xml:space="preserve" fill="#1bff00" font-weight="normal"><tspan x="0" dy="0">Press Z to continue</tspan></text></g></g></svg>