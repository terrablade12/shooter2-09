<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="326.32378" height="254.21905" viewBox="0,0,326.32378,254.21905"><g transform="translate(-82.56011,-34.5995)"><g fill="#ff0000" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-size="40"><text transform="translate(95.5347,54.58036) scale(0.45933,0.45933)" font-size="40" xml:space="preserve" fill="#ff0000" font-weight="400"><tspan x="0" dy="0">oh yeah heres a giude if you ened it</tspan></text><text transform="translate(82.78977,121.70528) scale(0.45933,0.45933)" font-size="40" xml:space="preserve" fill="#ff0000" font-weight="400"><tspan x="0" dy="0">Alright, moving on to bosses.</tspan><tspan x="0" dy="46.150000000000006px">You will be able to fight a boss</tspan><tspan x="0" dy="46.150000000000006px">every 5 waves. When fighting</tspan><tspan x="0" dy="46.150000000000006px">a boss, attacking it is not necessary.</tspan><tspan x="0" dy="46.150000000000006px">however, attacking it enough will</tspan><tspan x="0" dy="46.150000000000006px">weaken it, causing its attacks to be</tspan><tspan x="0" dy="46.150000000000006px">much easier.</tspan></text><text transform="translate(146.15617,283.70775) scale(0.4259,0.4259)" font-size="40" xml:space="preserve" fill="#ff0000" font-weight="normal"><tspan x="0" dy="0">Press Z to continue</tspan></text></g></g></svg>