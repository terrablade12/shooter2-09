<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="163.44508" height="49.56667" viewBox="0,0,163.44508,49.56667"><defs><radialGradient cx="295.33336" cy="180.00005" r="79.50965" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#2e0066" stop-opacity="0.80784"/><stop offset="1" stop-color="#000000" stop-opacity="0.74118"/></radialGradient></defs><g transform="translate(-213.74035,-155.21669)"><g stroke="#000000" stroke-miterlimit="10"><path d="M215.82371,203.03338v-46.06667h159.0193l-20.15425,46.06667z" fill="url(#color-1)" stroke-width="0"/><text transform="translate(243.18083,173.63355) scale(0.13548,0.13548)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="2" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">One time use. When dealing damage, absorb</tspan><tspan x="0" dy="48px">the damage done as dark energy. When the</tspan><tspan x="0" dy="48px">dark energy is at least half full, Press C to</tspan><tspan x="0" dy="48px">release a massive explosion. Dark energy</tspan><tspan x="0" dy="48px">reduces damage and health regen.</tspan></text><path d="M215.49035,203.03337v-46.06667h159.0193l-20.15425,46.06667z" fill="none" stroke-width="3.5"/><text transform="translate(241.87762,167.58041) scale(0.24684,0.24684)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="2" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">MAELSTROM OF MADNESS</tspan></text></g></g></svg>