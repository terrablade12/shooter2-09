<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="287.52264" height="131.48321" viewBox="0,0,287.52264,131.48321"><g transform="translate(-99.37739,-172.83677)"><g fill="#1bff00" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-weight="400" font-size="40"><text transform="translate(99.60706,192.81762) scale(0.45933,0.45933)" font-size="40" xml:space="preserve" fill="#1bff00"><tspan x="0" dy="0">Wonderful. Now, on this screen, </tspan><tspan x="0" dy="46.150000000000006px">you would find a new ability! </tspan><tspan x="0" dy="46.150000000000006px">However, those are only</tspan><tspan x="0" dy="46.150000000000006px">unlocked after defeating bosses.</tspan><tspan x="0" dy="46.150000000000006px">Anyways, for this time, just</tspan><tspan x="0" dy="46.150000000000006px">select "do not upgrade".</tspan></text></g></g></svg>