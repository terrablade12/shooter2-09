<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="378.16508" height="85.36973" viewBox="0,0,378.16508,85.36973"><g transform="translate(-51.06902,-136.18466)"><g fill="#ffffff" stroke="#000000" stroke-width="0" stroke-miterlimit="10" font-family="Sans Serif" font-weight="400" font-size="40"><text transform="translate(101.4852,149.14744) scale(0.30146,0.30146)" font-size="40" xml:space="preserve" fill="#ffffff"><tspan x="0" dy="0">When fighting a boss, you must attack until it is </tspan><tspan x="0" dy="48px">weakened, then its attacks will be much easier.</tspan><tspan x="0" dy="48px"> </tspan></text><text transform="translate(51.06902,189.14744) scale(0.30146,0.30146)" font-size="40" xml:space="preserve" fill="#ffffff"><tspan x="0" dy="0">Sometimes when the music changes, the boss will change phase. </tspan><tspan x="0" dy="48px">and  when that happens it will heal itself, so look out for when</tspan><tspan x="0" dy="48px">that happens and start attacking the boss to weaken it again.</tspan></text></g></g></svg>