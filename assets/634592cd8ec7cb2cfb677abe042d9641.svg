<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1802.98522" height="464.59771" viewBox="0,0,1802.98522,464.59771"><g transform="translate(103.39781,60.66154)"><g fill="#ff0000" stroke="none" stroke-miterlimit="10" font-family="Sans Serif" font-weight="400" font-size="40"><text transform="translate(-102.66351,303.48261) scale(1.4686,8.37113)" font-size="40" xml:space="preserve" fill="#ff0000"><tspan x="0" dy="0">blah blah blah balh blah blah blah balh blahl abl blah blabjhlbah</tspan></text><text transform="translate(82.78977,121.70528) scale(0.45933,0.45933)" font-size="40" xml:space="preserve" fill="#ff0000"><tspan x="0" dy="0">Alright, moving on to bosses.</tspan><tspan x="0" dy="46.150000000000006px">You will be able to fight a boss</tspan><tspan x="0" dy="46.150000000000006px">every 5 waves. When fighting</tspan><tspan x="0" dy="46.150000000000006px">a boss, attacking it is not necessary.</tspan><tspan x="0" dy="46.150000000000006px">however, attacking it enough will</tspan><tspan x="0" dy="46.150000000000006px">weaken it, causing its attacks to be</tspan><tspan x="0" dy="46.150000000000006px">much easier.</tspan></text></g></g></svg>